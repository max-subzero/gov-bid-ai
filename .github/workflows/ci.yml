name: GovBid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI Execution
        run: |
          python -m govbid.cli parse tests/fixtures/sample_rfp.txt
          python -m govbid.cli evaluate tests/fixtures/sample_rfp.txt tests/fixtures/sample_vendor.json
          python -m govbid.cli diff tests/fixtures/sample_rfp.txt tests/fixtures/sample_addendum.txt
